<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZenFinish</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            overflow: hidden; 
            height: 100vh; 
            background-color: #0f172a; 
            color: #f1f5f9; 
        }
        
        /* Kolory komórek */
        .cell-error { background-color: #451a1a !important; color: #fda4af; box-shadow: inset 0 0 0 1px #e11d48; }
        .cell-warning { background-color: #422006 !important; color: #fde047; box-shadow: inset 0 0 0 1px #ca8a04; }
        
        [contenteditable="true"]:focus {
            outline: 2px solid #3b82f6;
            background-color: #1e293b !important;
            color: #ffffff;
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.3);
            z-index: 50;
            position: relative;
        }

        .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: #0f172a; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb:hover { background: #475569; }

        .drop-zone.active { border-color: #10b981; background-color: rgba(16, 185, 129, 0.05); transform: scale(1.02); }
        
        .sticky-col { position: sticky; left: 0; z-index: 25; background: #1e293b; border-right: 2px solid #334155 !important; }
        .sticky-header { position: sticky; top: -1px; z-index: 40; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3); }

        .project-item:hover { background-color: #334155; color: #ffffff; }
        
        .check-icon { 
            display: inline-flex; align-items: center; justify-content: center; 
            width: 18px; height: 18px; border-radius: 6px; border: 1.5px solid #334155; 
            transition: all 0.3s ease; 
        }
        .check-active { 
            background-color: #10b981; border-color: #10b981; color: white; 
            transform: scale(1.1); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); 
        }
        .check-active::after { content: '✓'; font-weight: 900; font-size: 10px; }
        
        .dashboard-card { 
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); 
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
            border-radius: 1rem;
        }
        .dashboard-card:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(0,0,0,0.3); }

        .logo-img { filter: drop-shadow(0 0 15px rgba(16, 185, 129, 0.2)); object-fit: contain; }

        /* Doc Modal */
        .doc-card { 
            border: 2px solid transparent; 
            transition: all 0.2s; 
            cursor: pointer;
            background: #1e293b;
            position: relative;
        }
        .doc-card.selected { border-color: #3b82f6; background: #243147; }
        .doc-preview-container {
            width: 100%;
            height: 160px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0f172a;
            overflow: hidden;
            border-radius: 1rem;
            position: relative;
        }
        .doc-mask {
            position: absolute;
            inset: 0;
            background: rgba(15, 23, 42, 0.85);
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 1rem;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
            z-index: 5;
        }
        .doc-card.assigned .doc-mask { opacity: 1; pointer-events: auto; }
        
        .mask-text {
            color: #fff;
            font-weight: 950;
            font-size: 1.1rem;
            letter-spacing: 0.05em;
            text-transform: uppercase;
            text-shadow: 0 4px 8px rgba(0,0,0,0.8);
            outline: none;
            border-bottom: 1px dashed rgba(255,255,255,0);
            transition: border 0.3s;
        }
        .doc-card.editable .mask-text:hover { border-bottom-color: #3b82f6; }
        .doc-card.editable .mask-text:focus { border-bottom-color: #3b82f6; background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; }

        .rotate-btn { background: rgba(0,0,0,0.7); backdrop-filter: blur(4px); z-index: 10; }
        .type-btn {
            background: #1e293b;
            border: 1px solid rgba(255,255,255,0.05);
            transition: all 0.2s;
            text-align: left;
        }
        .type-btn:hover { background: #334155; transform: translateY(-1px); }
        .type-btn.active { background: #3b82f6; color: white; border-color: #3b82f6; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <!-- Top Nav -->
    <nav class="h-20 bg-[#1e293b] border-b border-white/5 flex items-center justify-between px-8 shrink-0 z-50 shadow-2xl">
        <div class="flex items-center gap-1">
            <img src="lotos_zf.png" alt="ZenFinish Logo" class="w-12 h-12 rounded-2xl logo-img">
            <h1 class="text-2xl font-[950] text-white leading-none tracking-tighter uppercase ml-2">ZEN<span class="text-emerald-400">FINISH</span></h1>
        </div>

        <div class="flex items-center gap-8 text-white">
            <div class="relative w-[32rem]" id="projectContainer">
                <input type="text" id="projectInput" autocomplete="off" placeholder="Wybierz projekt z listy..." class="w-full h-12 px-6 bg-[#0f172a] border border-white/5 rounded-2xl text-xs font-bold text-white focus:ring-2 focus:ring-emerald-500 outline-none transition-all placeholder:text-slate-700 shadow-inner">
                <div id="projectDropdown" class="hidden absolute top-full left-0 w-full mt-2 bg-[#1e293b] border border-white/10 rounded-2xl shadow-2xl max-h-80 overflow-y-auto z-[100] custom-scroll p-2"></div>
            </div>
            
            <button id="downloadBtn" class="hidden bg-emerald-600 hover:bg-emerald-700 text-white h-12 px-10 rounded-2xl text-[11px] font-black transition-all flex items-center gap-3 shadow-lg active:scale-95 uppercase tracking-widest">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="3"><path d="M4 16v1a2 2 0 002 2h12a2 2 0 002-2v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                GET FINISH!
            </button>
        </div>
    </nav>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar -->
        <aside class="w-72 bg-[#1e293b] border-r border-white/5 flex flex-col shrink-0">
            <div class="flex-1 p-6 space-y-6 overflow-y-auto custom-scroll flex flex-col">
                <!-- 1. UPLOAD BOX -->
                <section>
                    <div id="dropZone" class="drop-zone border-2 border-dashed border-white/10 rounded-[2.5rem] p-7 text-center cursor-pointer hover:border-emerald-500 transition-all group bg-[#0f172a]/50">
                        <input type="file" id="fileInput" class="hidden" accept=".xlsx, .xls, .csv">
                        <div class="space-y-4">
                            <div class="w-14 h-14 bg-[#1e293b] rounded-3xl flex items-center justify-center mx-auto text-slate-500 group-hover:text-emerald-400 transition-all shadow-xl border border-white/5">
                                <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                            </div>
                            <p id="fileStatusText" class="text-[10px] font-black text-slate-400 uppercase tracking-widest leading-tight">WGRAJ ANKIETĘ</p>
                        </div>
                    </div>
                </section>

                <!-- 2. CHECKPOINT CARD -->
                <div id="checkpointContainer" class="p-7 bg-[#0f172a] rounded-[2.5rem] shadow-2xl ring-1 ring-white/5">
                    <div class="flex items-center gap-3 mb-6">
                        <div class="w-2 h-2 bg-emerald-500 rounded-full shadow-[0_0_12px_#10b981]"></div>
                        <h4 class="text-[11px] font-black text-white uppercase tracking-[0.2em]">Checkpoint</h4>
                    </div>
                    
                    <div class="space-y-4">
                        <div class="flex items-center justify-between group">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-tight">Numery PESEL</span>
                            <div id="chk-pesel" class="check-icon"></div>
                        </div>
                        <div class="flex items-center justify-between group">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-tight">Paszporty</span>
                            <div id="chk-passport" class="check-icon"></div>
                        </div>
                        <div class="flex items-center justify-between group">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-tight">Telefony</span>
                            <div id="chk-phone" class="check-icon"></div>
                        </div>
                        <div class="flex items-center justify-between group">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-tight">Kody pocztowe</span>
                            <div id="chk-postcode" class="check-icon"></div>
                        </div>
                        <div class="flex items-center justify-between group">
                            <span class="text-[10px] text-slate-400 font-black uppercase tracking-tight">E-mail</span>
                            <div id="chk-email" class="check-icon"></div>
                        </div>
                    </div>

                    <div class="mt-8 pt-6 border-t border-white/5 flex flex-col gap-1">
                        <span class="text-[9px] text-slate-600 font-black uppercase tracking-widest leading-none">GOTOWOŚĆ</span>
                        <span id="readyPercentValue" class="text-5xl text-emerald-400 font-black leading-none tracking-tighter tabular-nums">0%</span>
                    </div>
                </div>

                <!-- 3. BRAND LOGO (VISIBLE ONLY AFTER LOAD) -->
                <div id="sidebarLogo" class="mt-auto hidden flex items-center justify-center p-4 animate-in fade-in duration-1000">
                    <img src="logo_zf.png" alt="ZenFinish Logo" class="w-full h-32 object-contain opacity-30 hover:opacity-100 transition-all duration-700">
                </div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="flex-1 overflow-y-auto custom-scroll bg-[#0f172a] relative scroll-smooth" id="mainWorkspace">
            <div id="workspaceContent" class="min-h-full flex flex-col">
                
                <div id="dashboardSection" class="p-10 pb-6 space-y-8 hidden text-slate-800">
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-10">
                        <div class="dashboard-card overflow-hidden flex flex-col">
                            <div class="bg-amber-500/5 px-8 py-5 border-b border-amber-500/10 flex justify-between items-center text-amber-500">
                                <h3 class="text-[11px] font-black uppercase tracking-widest italic text-amber-500">POPRAWIONE</h3>
                                <span id="fixCounter" class="bg-amber-500/10 text-amber-500 text-[10px] font-black px-4 py-1.5 rounded-full ring-1 ring-amber-500/20">0</span>
                            </div>
                            <div class="overflow-auto max-h-60 custom-scroll text-slate-400">
                                <table class="w-full text-left text-[11px]"><tbody id="fixList" class="divide-y divide-white/5"></tbody></table>
                            </div>
                        </div>
                        <div class="dashboard-card overflow-hidden flex flex-col">
                            <div class="bg-rose-500/5 px-8 py-5 border-b border-rose-500/10 flex justify-between items-center text-rose-500">
                                <h3 class="text-[11px] font-black uppercase tracking-widest italic text-rose-500">PUSTE</h3>
                                <span id="missingCounter" class="bg-rose-500/10 text-rose-500 text-[10px] font-black px-4 py-1.5 rounded-full ring-1 ring-rose-500/20">0</span>
                            </div>
                            <div class="overflow-auto max-h-60 custom-scroll p-6 space-y-3" id="missingGroups"></div>
                        </div>
                        <div class="dashboard-card overflow-hidden flex flex-col">
                            <div class="bg-orange-500/5 px-8 py-5 border-b border-orange-500/10 flex justify-between items-center text-orange-500 text-slate-800">
                                <h3 class="text-[11px] font-black uppercase tracking-widest italic text-orange-500">BŁĘDY</h3>
                                <span id="errorCounter" class="bg-orange-500/10 text-orange-500 text-[10px] font-black px-4 py-1.5 rounded-full ring-1 ring-orange-500/20">0</span>
                            </div>
                            <div class="overflow-auto max-h-60 custom-scroll text-slate-400">
                                <table class="w-full text-left text-[11px]"><tbody id="errorList" class="divide-y divide-white/5"></tbody></table>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="tableWrapper" class="flex-1 p-10 pt-4 hidden text-slate-800">
                    <div class="bg-[#1e293b] rounded-2xl border border-white/5 shadow-2xl flex flex-col ring-1 ring-white/5 overflow-hidden">
                        <div class="overflow-x-auto custom-scroll text-slate-300">
                            <table id="mainTable" class="w-full text-left border-separate border-spacing-0">
                                <thead class="sticky-header"><tr id="headerRow" class="bg-[#2a3a4f]"></tr></thead>
                                <tbody id="tableBody"></tbody>
                            </table>
                        </div>
                        <div class="h-16 bg-[#1e293b] border-t border-white/5 flex items-center justify-between px-12 shrink-0">
                            <div id="footerStats" class="text-[10px] font-black text-slate-500 uppercase tracking-[0.2em] italic"></div>
                            <div class="flex gap-10 text-[10px] font-black uppercase tracking-widest">
                                <span class="flex items-center gap-3"><div class="w-2.5 h-2.5 bg-rose-500 rounded-full shadow-[0_0_10px_#f43f5e]"></div> <span class="text-rose-400">Błąd</span></span>
                                <span class="flex items-center gap-3"><div class="w-2.5 h-2.5 bg-amber-400 rounded-full shadow-[0_0_10px_#fbbf24]"></div> <span class="text-amber-400">Poprawione</span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="emptyState" class="flex-1 flex flex-col items-center justify-center p-12">
                    <img src="logo_zf.png" alt="ZenFinish Logo" class="w-64 h-64 rounded-[5rem] shadow-[0_0_120px_rgba(16,185,129,0.15)] ring-1 ring-white/10 opacity-80 animate-pulse logo-img">
                </div>
            </div>
        </main>
    </div>

    <!-- DOCUMENT MODAL -->
    <div id="docModal" class="fixed inset-0 z-[100] hidden flex items-center justify-center p-6 backdrop-blur-xl bg-black/60 text-slate-800">
        <div class="bg-[#1e293b] w-full max-w-6xl h-[90vh] rounded-2xl shadow-2xl flex flex-col border border-white/5 overflow-hidden animate-in zoom-in duration-300">
            <div class="p-8 border-b border-white/5 flex justify-between items-center bg-[#0f172a]/50">
                <div>
                    <h2 class="text-3xl font-black text-white uppercase tracking-tighter" id="modalPersonName">DOKUMENTY</h2>
                    <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest mt-1">Ręczne zarządzanie pakietem dokumentów</p>
                </div>
                <div class="flex items-center gap-4">
                    <button id="zipDownloadBtn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-[11px] font-black px-8 py-3 rounded-xl uppercase tracking-widest shadow-xl active:scale-95 transition-all text-slate-800 font-black">POBIERZ ZIP</button>
                    <button onclick="closeDocModal()" class="w-12 h-12 flex items-center justify-center rounded-xl hover:bg-white/5 text-slate-500 text-2xl font-black">&times;</button>
                </div>
            </div>
            
            <div class="flex-1 flex overflow-hidden">
                <div class="w-1/4 p-8 bg-[#0f172a]/30 border-r border-white/5 flex flex-col gap-8 overflow-y-auto custom-scroll text-slate-800">
                    <div>
                        <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4">1. Dodawanie</h3>
                        <input type="file" id="docUploadInput" multiple class="hidden" accept="image/*,application/pdf">
                        <button onclick="document.getElementById('docUploadInput').click()" class="w-full h-32 bg-[#1e293b] border-2 border-dashed border-[#334155] flex flex-col items-center justify-center gap-2 rounded-2xl hover:border-emerald-500 transition-all group">
                            <div class="w-10 h-10 bg-blue-600 rounded-full flex items-center justify-center text-white shadow-lg group-hover:scale-110 transition-transform">
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"></path></svg>
                            </div>
                            <span class="text-[10px] font-black text-slate-400 mt-2 uppercase">WYBIERZ PLIKI</span>
                        </button>
                    </div>

                    <div>
                        <h3 class="text-[11px] font-black text-slate-500 uppercase tracking-widest mb-4 text-slate-400">2. Typ dokumentu</h3>
                        <div class="flex flex-col gap-2" id="typeButtons">
                            <button onclick="assignType('PASZPORT')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">Paszport</button>
                            <button onclick="assignType('PESEL')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">PESEL</button>
                            <button onclick="assignType('KP')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">Karta pobytu (KP)</button>
                            <button onclick="assignType('DECYZJA_KP')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">Decyzja KP</button>
                            <button onclick="assignType('WIZA')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">Wiza</button>
                            <button onclick="assignType('INNE')" class="type-btn p-4 rounded-xl text-[10px] font-black uppercase text-left text-slate-400">Inne</button>
                        </div>
                    </div>
                </div>

                <div class="flex-1 p-8 overflow-y-auto custom-scroll bg-[#0f172a]/10">
                    <div id="docPreviewList" class="grid grid-cols-4 gap-6"></div>
                </div>
            </div>
        </div>
    </div>

        const utils = {
            parseDate: (val) => {
                if (!val) return null;
                if (val instanceof Date) return val;
                if (!isNaN(val) && Number(val) > 30000) return new Date(Math.round((val - 25569) * 86400 * 1000));
                const s = String(val).replace(/[-/]/g, '.');
                const p = s.split('.');
                if (p.length === 3) {
                    if (p[0].length === 4) return new Date(p[0], p[1]-1, p[2]);
                    return new Date(p[2], p[1]-1, p[0]);
                }
                return null;
            },
            formatDate: (d) => d && !isNaN(d.getTime()) ? d.toLocaleDateString('ru-RU').padStart(10, '0') : "",
            isValidEmail: (e) => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e),
            formatStreet: (val) => {
                if (!val) return "";
                let s = String(val).trim().toUpperCase();
                if (s.includes(',')) return s.split(',').map(x => x.trim()).join(', ');
                const parts = s.split(/\s+/);
                if (parts.length >= 2) {
                    const lastPart = parts[parts.length - 1];
                    if (/^\d/.test(lastPart)) return `${parts.slice(0,-1).join(' ')}, ${lastPart}`;
                }
                return s;
            }
        };

        const safeSetText = (id, text) => { const el = document.getElementById(id); if (el) el.innerText = text; };

        function analyzeReadiness() {
            techFixesLog = []; missingDataLog = []; incorrectDataLog = [];
            checkStates = { pesel: true, passport: true, phone: true, postcode: true, email: true };

            if (processedData.length === 0) {
                Object.keys(checkStates).forEach(k => checkStates[k] = false);
                updateUI(0);
                return;
            }

            let earnedPoints = 0;
            const maxPoints = processedData.length * 10;

            processedData.forEach((rowObj, i) => {
                const d = rowObj.data;
                const line = i + 1;
                const name = rowObj.name;
                let rowPts = 0;

                const pClean = String(d[17] || '').replace(/\D/g, '');
                if (d[17] && pClean.length === 11) rowPts++;
                else { checkStates.pesel = false; if(d[17]) incorrectDataLog.push({ line, name, field: 'PESEL', reason: '11 cyfr' }); }

                [26,27,28,29,30].forEach(idx => {
                    if(d[idx]) rowPts++;
                    else missingDataLog.push({ line, name, field: FINISH_HEADERS[idx] });
                });
                if (!d[30] || !/^\d{2}-\d{3}$/.test(d[30])) checkStates.postcode = false;

                [41,42,43].forEach(idx => {
                    if(d[idx]) rowPts++;
                    else missingDataLog.push({ line, name, field: FINISH_HEADERS[idx] });
                });

                if (d[45] && utils.isValidEmail(d[45])) rowPts++;
                else { checkStates.email = false; if(d[45]) incorrectDataLog.push({ line, name, field: 'Email', reason: 'Składnia' }); else missingDataLog.push({ line, name, field: 'Email' }); }

                if (!d[7]) checkStates.passport = false;
                if (!d[33] && !d[34]) checkStates.phone = false;

                const filledVisa = VISA_INDICES.filter(idx => d[idx]).length;
                if (filledVisa > 0 && filledVisa < 4) missingDataLog.push({ line, name, field: 'DANE WIZOWE (niepełne)' });

                earnedPoints += rowPts;

                for (const [tIdx, origVal] of Object.entries(rowObj.originalValues)) {
                    const currVal = d[tIdx];
                    if (origVal && currVal && String(origVal).toUpperCase().trim() !== String(currVal).trim()) {
                        techFixesLog.push({ line, name, field: FINISH_HEADERS[tIdx], before: origVal, after: currVal });
                    }
                }
            });

            updateUI(Math.round((earnedPoints / maxPoints) * 100));
        }

        function updateUI(percent) {
            const elReady = document.getElementById('readyPercentValue');
            if (elReady) {
                elReady.innerText = percent + '%';
                elReady.style.color = percent === 100 ? '#10b981' : percent > 50 ? '#60a5fa' : '#f43f5e';
            }
            safeSetText('fixCounter', techFixesLog.length);
            safeSetText('missingCounter', missingDataLog.length);
            safeSetText('errorCounter', incorrectDataLog.length);

            const setChk = (id, state) => { const el = document.getElementById(id); if (el) el.className = state ? 'check-icon check-active' : 'check-icon'; };
            ['chk-pesel','chk-passport','chk-phone','chk-postcode','chk-email'].forEach(id => setChk(id, checkStates[id.split('-')[1]]));

            const fl = document.getElementById('fixList');
            if(fl) fl.innerHTML = techFixesLog.slice(0, 30).map(f => `<tr><td class="p-3 font-bold text-slate-500">#${f.line}</td><td class="p-3 text-[10px] text-slate-200 font-bold truncate max-w-[80px]">${f.name}</td><td class="p-3 text-[10px]"><span class="strike-through text-slate-600">${f.before}</span> → <span class="text-amber-400 font-bold">${f.after}</span></td></tr>`).join('') || '<tr><td class="p-4 text-center text-slate-500 italic uppercase">Brak zmian</td></tr>';

            const mg = document.getElementById('missingGroups');
            if(mg) {
                const grouped = {};
                missingDataLog.forEach(m => { if(!grouped[m.name]) grouped[m.name] = []; grouped[m.name].push(m.field); });

        }

                            <span class="mask-text" contenteditable="${d.type === 'INNE'}" onblur="updateInneLabel(${i}, this.innerText)" onclick="${d.type === 'INNE' ? 'event.stopPropagation()' : ''}">${d.label || ''}</span>
                        </div>
                        <button onclick="event.stopPropagation(); rotateFile(${i})" class="rotate-btn absolute bottom-2 right-2 w-8 h-8 rounded-lg flex items-center justify-center text-white shadow-xl"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg></button>
                    </div>
                    <div class="mt-3 px-1">
                        <p class="text-[9px] font-black text-slate-500 truncate uppercase tracking-tighter">${d.name}</p>
                    </div>
                </div>
            `).join('');
        }

        function selectFile(idx) { selectedFileIdx = idx; renderDocPreviews(); updateTypeButtons(); }
        function rotateFile(idx) { rowDocs[currentEditingRow][idx].rotation = (rowDocs[currentEditingRow][idx].rotation + 90) % 360; renderDocPreviews(); }

        function updateInneLabel(idx, newText) {
            const row = processedData[currentEditingRow];
            const firstName = String(row.data[4]).toUpperCase().replace(/\s+/g, '_');
            const lastName = String(row.data[3]).toUpperCase().replace(/\s+/g, '_');
            const fullName = `${firstName}_${lastName}`;
            let cleanLabel = newText.trim().toUpperCase().replace(/\s+/g, '_');
            if(!cleanLabel) cleanLabel = "INNE";
            rowDocs[currentEditingRow][idx].label = cleanLabel;
            rowDocs[currentEditingRow][idx].name = `${fullName}_${cleanLabel}`;
            renderDocPreviews();
        }

        function assignType(type) {
            if (selectedFileIdx === null) return;
            const files = rowDocs[currentEditingRow];
            const row = processedData[currentEditingRow];
            const firstName = String(row.data[4]).toUpperCase().replace(/\s+/g, '_');
            const lastName = String(row.data[3]).toUpperCase().replace(/\s+/g, '_');
            const fullName = `${firstName}_${lastName}`;
            const existingCount = files.filter((f, idx) => f.type === type && idx !== selectedFileIdx).length;
            const nextIndex = existingCount + 1;
            const typeStr = type.toUpperCase();
            let label = "";
            if (type === 'PASZPORT') label = nextIndex === 1 ? typeStr : `${typeStr}_${nextIndex}`;
            else if (type === 'PESEL') label = nextIndex === 1 ? typeStr : `${typeStr}_${nextIndex}`;
            else if (type === 'KP') label = `KP${nextIndex}`;
            else if (type === 'DECYZJA_KP') label = nextIndex === 1 ? `DECYZJA_KP` : `DECYZJA_KP_${nextIndex}`;
            else if (type === 'WIZA') label = nextIndex === 1 ? typeStr : `${typeStr}_${nextIndex}`;
            else label = nextIndex === 1 ? typeStr : `${typeStr}_${nextIndex}`;
            files[selectedFileIdx].type = type;
            files[selectedFileIdx].label = label;
            files[selectedFileIdx].name = `${fullName}_${label}`;
            renderDocPreviews(); updateTypeButtons();
        }

        function updateTypeButtons() {
            const btns = document.querySelectorAll('.type-btn');
            const currentType = selectedFileIdx !== null ? rowDocs[currentEditingRow][selectedFileIdx].type : null;
            btns.forEach(b => b.classList.toggle('active', b.getAttribute('onclick').includes(`'${currentType}'`)));
        }

        async function processAndZip() {
            const files = rowDocs[currentEditingRow] || [];
            if (!files.length) return;
            const row = processedData[currentEditingRow];
            const firstName = String(row.data[4]).toUpperCase().replace(/\s+/g, '_');
            const lastName = String(row.data[3]).toUpperCase().replace(/\s+/g, '_');
            const zip = new JSZip();
            for (const f of files) {
                if (!f.type) continue;
                const ext = f.file.name.split('.').pop();
                let fileData = f.file;
                if (f.rotation !== 0 && f.file.type.startsWith('image/')) { fileData = await applyRotation(f.file, f.rotation); }
                zip.file(`${f.name}.${ext}`, fileData);
            }
            const content = await zip.generateAsync({ type: "blob" });
            const a = document.createElement('a');
            a.href = URL.createObjectURL(content);
            a.download = `${firstName}_${lastName}_PASZPORT.ZIP`;
            a.click();
        }

        function applyRotation(file, degree) {
            return new Promise(res => {
                const img = new Image();
                img.onload = () => {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');
                    if (degree === 90 || degree === 270) { canvas.width = img.height; canvas.height = img.width; }
                    else { canvas.width = img.width; canvas.height = img.height; }
                    ctx.translate(canvas.width/2, canvas.height/2);
                    ctx.rotate(degree * Math.PI / 180);
                    ctx.drawImage(img, -img.width/2, -img.height/2);
                    canvas.toBlob(blob => res(blob), file.type);
                };
                img.src = URL.createObjectURL(file);
            });
        }

        // --- Main ---
        function runProcessing() {
            const project = document.getElementById('projectInput').value.trim();
            if (!rawData.length) return;
            processedData = [];
            for (let i = 1; i < rawData.length; i++) {
                const src = rawData[i];
                if (!src[6] && !src[7]) continue;
                const data = new Array(FINISH_HEADERS.length).fill("");
                const originalValues = {}; 
                data[1] = project.toUpperCase();
                for (const [sIdx, tIdx] of Object.entries(MAPPING)) {
                    let rawVal = String(src[sIdx] || "").trim();
                    originalValues[tIdx] = rawVal;
                    let clean = rawVal.toUpperCase();
                    if (tIdx === 7) clean = clean.replace(/\s+/g, '');
                    if (tIdx === 29) clean = utils.formatStreet(clean);
                    data[tIdx] = clean;
                }
                [5, 8, 9].forEach(idx => { const d = utils.parseDate(data[idx]); if (d) data[idx] = utils.formatDate(d); });
                if (data[30]) { const dgt = data[30].replace(/\D/g, ''); if (dgt.length === 5) data[30] = dgt.slice(0,2) + '-' + dgt.slice(2); }
                processedData.push({ data, originalValues, name: `${src[6]||''} ${src[7]||''}`.trim() || `Запись ${i}` });
            }
            analyzeReadiness(); renderTable();
            ['emptyState', 'tableWrapper', 'dashboardSection', 'downloadBtn', 'sidebarLogo'].forEach(id => {
                const el = document.getElementById(id);
                if (el) {
                    if (id === 'emptyState') el.classList.add('hidden');
                    else el.classList.remove('hidden');
                }
            });
        }

        function renderTable() {
            const head = document.getElementById('headerRow');
            const filteredIndices = FINISH_HEADERS.map((_, i) => i).filter(i => !HIDDEN_UI_COLS.includes(i));
            head.innerHTML = `<th class="p-5 border-b border-white/5 text-[10px] uppercase font-black text-slate-500 whitespace-nowrap bg-[#1e293b] sticky-col !z-[45]">DOKUMENTY</th>` + 
                filteredIndices.map((idx, uiIdx) => `<th class="p-5 border-b border-white/5 text-[9px] uppercase font-black text-slate-600 whitespace-nowrap bg-[#1e293b] ${idx <= 4 ? 'sticky-col !bg-[#1e293b] z-30' : ''}">${UI_DISPLAY_HEADERS[uiIdx]}</th>`).join('');
            const body = document.getElementById('tableBody');
            if (!body) return; body.innerHTML = '';
            processedData.forEach((rowObj, rIdx) => {
                const tr = document.createElement('tr');
                tr.className = "hover:bg-blue-500/5 transition-colors group";
                const hasDocs = rowDocs[rIdx] && rowDocs[rIdx].some(d => d.type);
                const docTd = document.createElement('td');
                docTd.className = "p-5 border-b border-white/5 sticky-col !z-40 text-center";
                docTd.innerHTML = `<button onclick="openDocModal(${rIdx})" class="w-10 h-10 rounded-xl ${hasDocs ? 'bg-emerald-500 text-white shadow-[0_0_15px_rgba(16,185,129,0.3)]' : 'bg-slate-800 text-slate-500'} hover:scale-105 transition-all flex items-center justify-center"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M3 9a2 2 0 012-2h.93a2 2 0 001.664-.89l.812-1.22A2 2 0 0110.07 4h3.86a2 2 0 011.664.89l.812 1.22A2 2 0 0018.07 7H19a2 2 0 012 2v9a2 2 0 01-2 2H5a2 2 0 01-2-2V9z"></path><path d="M15 13a3 3 0 11-6 0 3 3 0 016 0z"></path></svg></button>`;
                tr.appendChild(docTd);
                const filledVisa = VISA_INDICES.filter(idx => rowObj.data[idx]).length;
                const isVisaInconsistent = filledVisa > 0 && filledVisa < 4;
                filteredIndices.forEach(idx => {
                    const td = document.createElement('td');
                    const cell = rowObj.data[idx];
                    let cls = `p-5 border-b border-white/5 text-[11px] text-slate-400 font-medium whitespace-nowrap ${idx <= 4 ? 'sticky-col !text-white font-black z-10' : ''}`;
                    if (POINT_FIELDS.includes(idx)) {
                        if (!cell) cls += " cell-error";
                        else if (idx === 17 && String(cell).replace(/\D/g,'').length !== 11) cls += " cell-error";
                        else if (idx === 45 && !utils.isValidEmail(cell)) cls += " cell-error";
                    }
                    if (isVisaInconsistent && VISA_INDICES.includes(idx)) cls += " cell-error";
                    if (rowObj.originalValues[idx] && String(rowObj.originalValues[idx]).toUpperCase() !== String(cell).toUpperCase()) cls += " cell-warning";
                    td.className = cls; td.innerText = cell || '';
                    if (idx !== 0 && idx !== 39) {
                        td.contentEditable = "true";
                        td.onblur = () => {
                            let val = td.innerText.trim().toUpperCase();
                            if (idx === 29) val = utils.formatStreet(val);
                            rowObj.data[idx] = val; td.innerText = val;
                            analyzeReadiness(); renderTable();
                        };
                    }
                    tr.appendChild(td);
                });
                body.appendChild(tr);
            });
            safeSetText('footerStats', `OSÓB W FINISZU: ${processedData.length}`);
        }

        const projectInput = document.getElementById('projectInput');
        function filterPrj(v) {
            const drop = document.getElementById('projectDropdown');
            const list = PROJECTS.filter(p => p.toLowerCase().includes(v.toLowerCase()));
            drop.innerHTML = list.map(p => `<div class="project-item p-4 text-[11px] cursor-pointer rounded-2xl text-slate-300 font-bold uppercase">${p}</div>`).join('');
            drop.classList.toggle('hidden', !list.length);
        }
        projectInput.onfocus = () => filterPrj(projectInput.value);
        projectInput.oninput = (e) => filterPrj(e.target.value);
        document.getElementById('projectDropdown').onclick = (e) => { if(e.target.classList.contains('project-item')) { projectInput.value = e.target.innerText; document.getElementById('projectDropdown').classList.add('hidden'); }};
        document.addEventListener('mousedown', (e) => { if (!document.getElementById('projectContainer').contains(e.target)) document.getElementById('projectDropdown').classList.add('hidden'); });

        const fileInput = document.getElementById('fileInput');
        document.getElementById('dropZone').onclick = () => fileInput.click();
        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            document.getElementById('fileStatusText').innerText = file.name;
            const reader = new FileReader();
            reader.onload = (evt) => {
                const wb = XLSX.read(new Uint8Array(evt.target.result), { type: 'array' });
                rawData = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1 });
                runProcessing();
            };
            reader.readAsArrayBuffer(file);
        };
        document.getElementById('docUploadInput').onchange = handleDocUpload;
        document.getElementById('zipDownloadBtn').onclick = processAndZip;
        document.getElementById('downloadBtn').onclick = () => {
            const d = new Date();
            const dateStr = `${String(d.getDate()).padStart(2,'0')}.${String(d.getMonth()+1).padStart(2,'0')}.${String(d.getFullYear()).slice(-2)}`;
            const fileName = `FINISZ_${projectInput.value.trim() || 'PROJECT'}_${dateStr}_${processedData.length}OS.XLSX`;
            const ws = XLSX.utils.aoa_to_sheet([FINISH_HEADERS, ...processedData.map(r => r.data)]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, "FINISH");
            XLSX.writeFile(wb, fileName);
        };
        ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(n => document.getElementById('dropZone').addEventListener(n, e => { 
            e.preventDefault(); if(n === 'dragenter' || n === 'dragover') e.currentTarget.classList.add('active'); else e.currentTarget.classList.remove('active');
            if(n === 'drop' && e.dataTransfer.files.length) { fileInput.files = e.dataTransfer.files; fileInput.dispatchEvent(new Event('change')); }
        }));
    </script>
</body>
